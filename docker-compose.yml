services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: managers
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d managers"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.31
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./liquibase:/liquibase/changelog
    command:
      - --search-path=/liquibase/changelog
      - --changelog-file=changelog.xml
      - --url=jdbc:postgresql://db:5432/managers
      - --username=postgres
      - --password=postgres
      - update
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - app-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.monitoring.enabled: "false"
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - app-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: a7a6311933d3503b89bc2dbc36572c33
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-network

  api:
    build:
      context: ./ManagerService
      dockerfile: Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
      reports:
        condition: service_started
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=managers;Username=postgres;Password=postgres
      ReportService__BaseUrl: http://reports:8080
      Logstash__Url: http://logstash:8080
    networks:
      - app-network

  reports:
    build:
      context: ./ReportService
      dockerfile: Dockerfile
    depends_on:
      liquibase:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=managers;Username=postgres;Password=postgres
      Logstash__Url: http://logstash:8080
    networks:
      - app-network

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:8080"
    environment:
      ReverseProxy__Clusters__managers__Destinations__d1__Address: http://api:8080/
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  esdata:
